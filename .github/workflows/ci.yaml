name: Pipeline checks

"on": [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-eda.txt
            requirements-pipeline.txt
            requirements-tracking.txt
      - name: Install notebook and pipeline dependencies
        run: python -m pip install -r requirements-eda.txt -r requirements-pipeline.txt -r requirements-tracking.txt
      - name: Check stage behavior on small fixtures
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: python -m unittest discover -s tests -v
      - name: Check extension behavior
        run: node --test extension/tests/lib.test.mjs
