name: Pipeline checks

"on": [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install extension test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-eda.txt
            requirements-pipeline.txt
            requirements-tracking.txt
            requirements-serving.txt
            requirements-serving-test.txt
            requirements-worker.txt
            requirements-infra.txt
      - name: Install notebook and pipeline dependencies
        run: python -m pip install -r requirements-eda.txt -r requirements-pipeline.txt -r requirements-tracking.txt -r requirements-serving-test.txt -r requirements-worker.txt -r requirements-infra.txt
      - name: Check stage behavior on small fixtures
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: python -m unittest discover -s tests -t . -v
      - name: Check extension behavior
        run: npm test
