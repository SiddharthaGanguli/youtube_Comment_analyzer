# Dataset metadata. Paths are relative to the repository root.
# DVC storage settings belong in .dvc/config, not in this file.
dataset:
  name: Arshia82sbn/youtube-sentiment-dataset
  source:
    repository: https://huggingface.co/datasets/Arshia82sbn/youtube-sentiment-dataset
    revision: 7561b9e5d8f8054d085e0dd50bb29b0fe2e8cb1e
    url: https://huggingface.co/datasets/Arshia82sbn/youtube-sentiment-dataset/resolve/7561b9e5d8f8054d085e0dd50bb29b0fe2e8cb1e/youtube-comments-sentiment.csv
    size_bytes: 445484444
    sha256: 9090469dd235cffa05b7f2e551696d46fa064c16a8c1f77e76801476a462458b
  raw_path: data/raw/youtube-comments-sentiment.csv
  dvc_file: data/raw/youtube-comments-sentiment.csv.dvc
  encoding: utf-8
  columns:
    text: CommentText
    video_title: VideoTitle
    sentiment: Sentiment
    target: Sentiment_label
  label_mapping:
    0: Negative
    1: Neutral
    2: Positive

# Ingestion restores the DVC-tracked CSV when it is missing, then verifies it.
data_ingestion:
  root_dir: artifacts/data_ingestion
  report_file: artifacts/data_ingestion/ingestion_report.json
  restore_with_dvc: true

data_validation:
  root_dir: artifacts/data_validation
  report_file: artifacts/data_validation/validation_report.json
  quarantine_file: artifacts/data_validation/quarantine_rows.csv
  required_columns:
    - VideoTitle
    - CommentText
    - Sentiment
    - Sentiment_label
    - clean_comment_text
    - tokens_comment_text
    - clean_title
    - token_title

data_preprocessing:
  root_dir: artifacts/data_preprocessing
  train_file: artifacts/data_preprocessing/train.csv
  validation_file: artifacts/data_preprocessing/validation.csv
  test_file: artifacts/data_preprocessing/test.csv
  report_file: artifacts/data_preprocessing/preprocessing_report.json

model_training:
  root_dir: artifacts/model_training
  model_file: artifacts/model_training/sentiment_model.joblib
  report_file: artifacts/model_training/training_report.json
