stages:
  ingestion:
    cmd: python main.py --stage ingestion
    deps:
      - main.py
      - config/config.yaml
      - src/Sentiment_analysis/config/config.py
      - src/Sentiment_analysis/entity/entity.py
      - src/Sentiment_analysis/utils/common.py
      - src/Sentiment_analysis/components/data_ingestion.py
      - src/Sentiment_analysis/pipeline/pipeline_01_data_ingestion.py
      - logging_/logger_.py
      - data/raw/youtube-comments-sentiment.csv
    outs:
      - artifacts/data_ingestion
  validation:
    cmd: python main.py --stage validation
    deps:
      - main.py
      - config/config.yaml
      - src/Sentiment_analysis/config/config.py
      - src/Sentiment_analysis/entity/entity.py
      - src/Sentiment_analysis/utils/common.py
      - src/Sentiment_analysis/components/data_validation.py
      - src/Sentiment_analysis/pipeline/pipeline_02_data_validation.py
      - logging_/logger_.py
      - data/raw/youtube-comments-sentiment.csv
      - artifacts/data_ingestion
    outs:
      - artifacts/data_validation
  preprocessing:
    cmd: python main.py --stage preprocessing
    deps:
      - main.py
      - config/config.yaml
      - config/params.yaml
      - requirements-pipeline.txt
      - src/Sentiment_analysis/config/config.py
      - src/Sentiment_analysis/entity/entity.py
      - src/Sentiment_analysis/utils/common.py
      - src/Sentiment_analysis/components/data_preprocessing.py
      - src/Sentiment_analysis/pipeline/pipeline_03_data_preprocessing.py
      - logging_/logger_.py
      - data/raw/youtube-comments-sentiment.csv
      - artifacts/data_validation
    outs:
      - artifacts/data_preprocessing
  training:
    cmd: python main.py --stage training
    deps:
      - main.py
      - config/config.yaml
      - config/params.yaml
      - requirements-pipeline.txt
      - requirements-tracking.txt
      - src/Sentiment_analysis/config/config.py
      - src/Sentiment_analysis/entity/entity.py
      - src/Sentiment_analysis/utils/common.py
      - src/Sentiment_analysis/utils/experiment_tracking.py
      - src/Sentiment_analysis/utils/aws_credentials.py
      - src/Sentiment_analysis/components/model_training.py
      - src/Sentiment_analysis/pipeline/pipeline_04_model_training.py
      - logging_/logger_.py
      - artifacts/data_preprocessing/train.csv
      - artifacts/data_preprocessing/validation.csv
      - artifacts/data_preprocessing/preprocessing_report.json
    outs:
      - artifacts/model_training
  evaluation:
    cmd: python main.py --stage evaluation
    deps:
      - main.py
      - config/config.yaml
      - config/params.yaml
      - requirements-pipeline.txt
      - requirements-tracking.txt
      - requirements-eda.txt
      - src/Sentiment_analysis/config/config.py
      - src/Sentiment_analysis/entity/entity.py
      - src/Sentiment_analysis/utils/common.py
      - src/Sentiment_analysis/utils/experiment_tracking.py
      - src/Sentiment_analysis/utils/aws_credentials.py
      - src/Sentiment_analysis/components/model_evaluation.py
      - src/Sentiment_analysis/pipeline/pipeline_05_model_evaluation.py
      - logging_/logger_.py
      - artifacts/data_preprocessing
      - artifacts/model_training
    outs:
      - artifacts/model_evaluation
    metrics:
      - reports/evaluation_metrics.json:
          cache: false
